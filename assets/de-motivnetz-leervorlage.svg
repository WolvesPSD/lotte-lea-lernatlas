<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
  <title id="title">Leere Vorlage für ein eigenes Motivnetz zu zwei Gedichten</title>
  <desc id="desc">Vier leere Pflichtfelder für Text A, Text B, gemeinsames Motiv und offene Frage sowie ein freier Zusatzknoten. Zwischen den Feldern ist Platz für selbst gezeichnete und beschriftete Verbindungen; darunter stehen Linien für eine Textfassung und ihre Grenze. Die Vorlage enthält keine Lösung.</desc>
  <rect width="794" height="1123" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#17324a">
    <text x="58" y="57" font-size="27" font-weight="700">Mein Motivnetz</text>
    <text x="58" y="89" font-size="15">Name: ______________________________   Datum: ______________</text>
    <text x="58" y="124" font-size="15">Trage eigene Aussagen und Zeilenbelege ein. Zeichne die Verbindungen selbst.</text>
    <text x="58" y="145" font-size="15">Beschrifte mindestens zwei Vergleiche. Für eine spätere Änderung ist ein Knoten frei.</text>
  </g>
  <g fill="#f9fbfb" stroke="#315467" stroke-width="2">
    <rect x="58" y="195" width="280" height="212" rx="12"/>
    <rect x="456" y="195" width="280" height="212" rx="12"/>
    <rect x="254" y="481" width="286" height="154" rx="12"/>
    <rect x="58" y="710" width="280" height="154" rx="12"/>
    <rect x="456" y="710" width="280" height="154" rx="12"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#17324a" font-size="18" font-weight="700">
    <text x="78" y="226">Text A · Situation / Zeilen</text>
    <text x="476" y="226">Text B · Situation / Zeilen</text>
    <text x="274" y="512">Gemeinsames Motiv / Belege</text>
    <text x="78" y="741">Freier Zusatzknoten</text>
    <text x="476" y="741">Offene Frage(n) / Belege</text>
  </g>
  <g stroke="#bac8cd" stroke-width="1">
    <path d="M78 275H318 M78 315H318 M78 355H318"/>
    <path d="M476 275H716 M476 315H716 M476 355H716"/>
    <path d="M274 560H520 M274 600H520"/>
    <path d="M78 790H318 M78 830H318"/>
    <path d="M476 790H716 M476 830H716"/>
    <path d="M58 974H736 M58 1014H736 M58 1054H736"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#3b5662" font-size="15">
    <text x="58" y="922">Lineare Textfassung und eine Grenze der Karte:</text>
    <text x="58" y="1094">Eigene leere Lernvorlage · keine Musterlösung · auch Papier ohne Vorlage möglich</text>
  </g>
</svg>
