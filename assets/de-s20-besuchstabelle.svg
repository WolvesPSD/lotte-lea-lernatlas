<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">Redaktionelle Tabelle zu drei berichteten Besuchswerten</title>
  <desc id="desc">Die Nennreihenfolge 1, 2, 3 aus Kommentarzeile A05 hat die Besuchswerte 12, 9, 15. Die Tabelle ist keine ursprüngliche Zählnotiz.</desc>
  <rect width="760" height="270" fill="#f7faf8"/>
  <text x="24" y="36" fill="#153b3d" font-family="Arial, sans-serif" font-size="21" font-weight="700">Drei im Kommentar berichtete Werte</text>
  <text x="24" y="64" fill="#37595c" font-family="Arial, sans-serif" font-size="15">Redaktionelle Neuordnung von A05 · keine ursprüngliche Zählnotiz</text>
  <rect x="24" y="83" width="712" height="112" rx="8" fill="#ffffff" stroke="#66898a" stroke-width="2"/>
  <path d="M24 139H736 M456 83V195 M549 83V195 M642 83V195" stroke="#66898a" stroke-width="2"/>
  <rect x="25" y="84" width="710" height="54" rx="7" fill="#e4f0ec"/>
  <text x="42" y="116" fill="#153b3d" font-family="Arial, sans-serif" font-size="16" font-weight="700">Nennung in A05</text>
  <text x="494" y="116" fill="#153b3d" font-family="Arial, sans-serif" font-size="17" font-weight="700">1</text>
  <text x="587" y="116" fill="#153b3d" font-family="Arial, sans-serif" font-size="17" font-weight="700">2</text>
  <text x="680" y="116" fill="#153b3d" font-family="Arial, sans-serif" font-size="17" font-weight="700">3</text>
  <text x="42" y="174" fill="#153b3d" font-family="Arial, sans-serif" font-size="16">Besuche je zusätzlicher Mittwochs-Stunde</text>
  <text x="487" y="174" fill="#153b3d" font-family="Arial, sans-serif" font-size="17">12</text>
  <text x="587" y="174" fill="#153b3d" font-family="Arial, sans-serif" font-size="17">9</text>
  <text x="673" y="174" fill="#153b3d" font-family="Arial, sans-serif" font-size="17">15</text>
  <text x="24" y="225" fill="#37595c" font-family="Arial, sans-serif" font-size="15">1–3 sind die Reihenfolge der Nennung, keine zusätzlichen Kalenderdaten.</text>
  <text x="24" y="248" fill="#37595c" font-family="Arial, sans-serif" font-size="15">Besuche sind nicht als verschiedene Personen nachgewiesen.</text>
</svg>
