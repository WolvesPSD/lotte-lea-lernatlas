<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A garden scene</title>
  <desc id="desc">A wide, simple illustration of a garden. Three wooden raised beds stand across the foreground, with a curving pale path between the first two. In the left bed, a child in a blue coat and yellow boots waters leafy plants with a green watering can. In the middle bed, two red tomatoes grow beside a tall sunflower. On the right, another child in a red raincoat kneels beside a small purple flower and looks at it through a magnifying glass. A brown shed stands behind the beds on the left. A small bird stands near the right edge of the picture. Grey clouds and a patch of blue sky are overhead. The picture shows visible positions and actions; it does not show what anyone is thinking or why they are there.</desc>
