  <title id="title">Erfundene Leseecke, Bild A</title>
  <desc id="desc">Eine Person im blauen Oberteil sitzt an einem Tisch und hält ein geöffnetes rotes Buch in den Händen. Links auf dem Tisch steht eine gelbe Lampe. Rechts daneben steht eine grüne Topfpflanze. Auf dem Regal im Hintergrund sind zwei Bücher.</desc>
