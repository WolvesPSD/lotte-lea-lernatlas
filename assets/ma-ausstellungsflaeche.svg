<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" role="img" aria-labelledby="title desc">
  <title id="title">Koordinatenpläne einer sechseckigen Fläche und eines Parallelogramms</title>
  <desc id="desc">Links liegen A bei 0,0, B bei 12,0, C bei 12,4, D bei 9,8, E bei 3,8 und F bei 0,4. Rechts liegen P bei 0,0, Q bei 6,0, R bei 9,4 und S bei 3,4. Jeder kleine Rasterabstand entspricht einem Meter. Die Hilfslinie FC und Höhen sind nicht eingezeichnet.</desc>
  <defs>
    <pattern id="grid-main" x="48" y="80" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M 18 0 L 0 0 0 18" fill="none" stroke="#cbd8d3" stroke-width="1"/></pattern>
    <pattern id="grid-transfer" x="345" y="152" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M 18 0 L 0 0 0 18" fill="none" stroke="#cbd8d3" stroke-width="1"/></pattern>
  </defs>
  <rect width="620" height="270" fill="#fffdf9"/>
  <text x="34" y="30" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#123e42">1 · Ausstellungsfläche</text>
  <text x="343" y="30" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#123e42">2 · Parallelogramm</text>
  <rect x="48" y="80" width="216" height="144" fill="url(#grid-main)" stroke="#48615f"/>
  <path d="M48 224 L264 224 L264 152 L210 80 L102 80 L48 152 Z" fill="#b9dcd5" fill-opacity=".62" stroke="#075b61" stroke-width="3"/>
  <g fill="#075b61" stroke="#fffdf9" stroke-width="1">
    <circle cx="48" cy="224" r="4"/><circle cx="264" cy="224" r="4"/><circle cx="264" cy="152" r="4"/><circle cx="210" cy="80" r="4"/><circle cx="102" cy="80" r="4"/><circle cx="48" cy="152" r="4"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#172b2d">
    <text x="32" y="219">A</text><text x="270" y="219">B</text><text x="270" y="151">C</text><text x="211" y="73">D</text><text x="90" y="73">E</text><text x="52" y="145">F</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="10" fill="#485c5d">
    <text x="46" y="240">0</text><text x="99" y="240">3</text><text x="153" y="240">6</text><text x="207" y="240">9</text><text x="257" y="240">12</text>
    <text x="34" y="156">4</text><text x="34" y="84">8</text><text x="268" y="226">x</text><text x="47" y="72">y</text>
  </g>
  <rect x="345" y="152" width="162" height="72" fill="url(#grid-transfer)" stroke="#48615f"/>
  <path d="M345 224 L453 224 L507 152 L399 152 Z" fill="#d8d3ec" fill-opacity=".72" stroke="#624a80" stroke-width="3"/>
  <g fill="#624a80" stroke="#fffdf9" stroke-width="1"><circle cx="345" cy="224" r="4"/><circle cx="453" cy="224" r="4"/><circle cx="507" cy="152" r="4"/><circle cx="399" cy="152" r="4"/></g>
  <g font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#172b2d"><text x="328" y="219">P</text><text x="438" y="216">Q</text><text x="511" y="150">R</text><text x="388" y="146">S</text></g>
  <g font-family="Arial,sans-serif" font-size="10" fill="#485c5d"><text x="343" y="240">0</text><text x="397" y="240">3</text><text x="451" y="240">6</text><text x="505" y="240">9</text><text x="330" y="156">4</text><text x="511" y="226">x</text><text x="344" y="145">y</text></g>
</svg>
