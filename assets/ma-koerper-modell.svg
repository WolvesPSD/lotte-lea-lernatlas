  <path d="M617 407 L697 540" fill="none" stroke="#be6a24" stroke-width="4"/>
  <circle cx="617" cy="539" r="4" fill="#a94441"/>
  <text x="737" y="444" font-family="Arial, sans-serif" font-size="17" fill="#173747">a = 6 cm</text>
  <text x="737" y="475" font-family="Arial, sans-serif" font-size="17" fill="#173747">h = 4 cm</text>
  <text x="737" y="506" font-family="Arial, sans-serif" font-size="17" fill="#173747">m = 5 cm</text>
  <text x="737" y="535" font-family="Arial, sans-serif" font-size="14" fill="#9c511d">m: Flächenhöhe</text>
  <text x="737" y="556" font-family="Arial, sans-serif" font-size="14" fill="#8d3735">h: senkrecht</text>
</svg>
