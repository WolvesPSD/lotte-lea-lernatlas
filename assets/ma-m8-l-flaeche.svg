<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-labelledby="title desc">
  <title id="title">Quadrat mit herausgenommenem Eckquadrat</title>
  <desc id="desc">Ein grosses Quadrat hat Seitenlänge a gleich 7 Zentimeter. Oben rechts ist ein kleines Quadrat mit Seitenlänge b gleich 3 Zentimeter ausgespart. Die verbleibende L-förmige Fläche besteht aus einem linken blauen Rechteck I und einem gelben Rechteck II unten rechts. Das Bild ist eine Skizze und nicht zum Abmessen.</desc>
  <rect width="520" height="380" rx="18" fill="#f7fafc"/>
  <rect x="24" y="20" width="472" height="340" rx="16" fill="#ffffff" stroke="#9bb2c4" stroke-width="2"/>
  <text x="44" y="52" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#102a43">Die verbleibende L-Fläche</text>
  <rect x="105" y="95" width="120" height="210" fill="#d8edf9" stroke="#17324d" stroke-width="3"/>
  <rect x="225" y="185" width="90" height="120" fill="#f9e7b7" stroke="#17324d" stroke-width="3"/>
  <rect x="225" y="95" width="90" height="90" fill="#f7fafc" stroke="#17324d" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="105" y="95" width="210" height="210" fill="none" stroke="#17324d" stroke-width="3"/>
  <text x="155" y="204" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">I</text>
  <text x="258" y="254" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">II</text>
  <text x="235" y="137" font-family="Arial, sans-serif" font-size="18" fill="#17324d">frei</text>
  <text x="173" y="82" font-family="Arial, sans-serif" font-size="18" fill="#17324d">a = 7 cm</text>
  <line x1="105" y1="87" x2="315" y2="87" stroke="#17324d" stroke-width="2"/>
  <text x="335" y="132" font-family="Arial, sans-serif" font-size="18" fill="#17324d">b = 3 cm</text>
  <line x1="325" y1="95" x2="325" y2="185" stroke="#17324d" stroke-width="2"/>
  <text x="46" y="339" font-family="Arial, sans-serif" font-size="16" fill="#3b536a">Skizze · nicht abmessen · die Zahlen gelten.</text>
</svg>
