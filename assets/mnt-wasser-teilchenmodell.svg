<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-labelledby="title desc">
  <title id="title">Drei erfundene Wassermodelle X, Y und Z</title>
  <desc id="desc">X zeigt Kreise verteilt im verfügbaren Raum, Y geordnet an Plätzen und Z dicht mit wechselnden Nachbarn. Die Kreise sind Modellzeichen ohne Messmaßstab.</desc>
  <rect width="780" height="290" fill="#f5fafb"/>
  <g font-family="Arial, sans-serif" fill="#173944">
    <text x="20" y="29" font-size="20" font-weight="700">Drei Wassermodelle</text>
    <text x="20" y="51" font-size="12">Gleiche Modellzeichen ○ · keine Teilchengröße, Anzahl oder Abstände gemessen</text>
    <g stroke="#9cbcc2" stroke-width="2" fill="#fff">
      <rect x="20" y="68" width="238" height="178" rx="10"/>
      <rect x="271" y="68" width="238" height="178" rx="10"/>
      <rect x="522" y="68" width="238" height="178" rx="10"/>
    </g>
    <text x="36" y="96" font-size="19" font-weight="700">X</text>
    <text x="287" y="96" font-size="19" font-weight="700">Y</text>
    <text x="538" y="96" font-size="19" font-weight="700">Z</text>
    <g fill="#d6eef2" stroke="#196775" stroke-width="2">
      <circle cx="65" cy="135" r="10"/><circle cx="146" cy="116" r="10"/><circle cx="221" cy="149" r="10"/><circle cx="105" cy="201" r="10"/><circle cx="200" cy="216" r="10"/>
      <circle cx="311" cy="139" r="10"/><circle cx="359" cy="139" r="10"/><circle cx="407" cy="139" r="10"/><circle cx="455" cy="139" r="10"/>
      <circle cx="311" cy="189" r="10"/><circle cx="359" cy="189" r="10"/><circle cx="407" cy="189" r="10"/><circle cx="455" cy="189" r="10"/>
      <circle cx="563" cy="176" r="10"/><circle cx="599" cy="160" r="10"/><circle cx="637" cy="185" r="10"/><circle cx="677" cy="165" r="10"/><circle cx="720" cy="184" r="10"/>
      <circle cx="583" cy="211" r="10"/><circle cx="621" cy="222" r="10"/><circle cx="659" cy="208" r="10"/><circle cx="700" cy="220" r="10"/>
    </g>
    <text x="31" y="264" font-size="13">im Raum verteilt</text>
    <text x="282" y="264" font-size="13">geordnete Plätze</text>
    <text x="533" y="264" font-size="13">Nachbarn wechseln</text>
  </g>
</svg>
