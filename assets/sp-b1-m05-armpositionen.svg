      <text x="-84" y="-28" font-size="20" font-weight="700" fill="#17324a">B2 · t2</text>
      <use href="#body"/>
      <path d="M-35 45 L-48 103 M35 45 L55 113" stroke="#334155" stroke-width="5" fill="none"/>
      <rect x="-60" y="91" width="24" height="24" rx="3" fill="#2563eb"/>
      <text x="-55" y="109" font-size="16" font-weight="700" fill="#fff">L</text>
      <circle cx="55" cy="113" r="11" fill="#f59e0b"/>
