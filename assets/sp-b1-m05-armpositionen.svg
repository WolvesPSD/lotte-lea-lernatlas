      <rect x="-108" y="-58" width="216" height="277" rx="13" fill="#fff" stroke="#cbd5e1"/>
      <text x="-84" y="-28" font-size="20" font-weight="700" fill="#17324a">A1 · t1</text>
      <use href="#body"/>
      <path d="M-35 45 L-53 108 M35 45 L54 112" stroke="#334155" stroke-width="5" fill="none"/>
      <rect x="-66" y="97" width="24" height="24" rx="3" fill="#2563eb"/>
      <text x="-61" y="115" font-size="16" font-weight="700" fill="#fff">L</text>
      <circle cx="54" cy="112" r="11" fill="#f59e0b"/>
    </g>
    <g transform="translate(375 147)">
      <rect x="-108" y="-58" width="216" height="277" rx="13" fill="#fff" stroke="#cbd5e1"/>
      <text x="-84" y="-28" font-size="20" font-weight="700" fill="#17324a">A2 · t2</text>
      <use href="#body"/>
      <path d="M-35 45 L18 106 M35 45 L56 111" stroke="#334155" stroke-width="5" fill="none"/>
      <rect x="6" y="94" width="24" height="24" rx="3" fill="#2563eb"/>
      <text x="11" y="112" font-size="16" font-weight="700" fill="#fff">L</text>
      <circle cx="56" cy="111" r="11" fill="#f59e0b"/>
    </g>
    <g transform="translate(625 147)">
      <rect x="-108" y="-58" width="216" height="277" rx="13" fill="#fff" stroke="#cbd5e1"/>
      <text x="-84" y="-28" font-size="20" font-weight="700" fill="#17324a">B1 · t1</text>
      <use href="#body"/>
      <path d="M-35 45 L-52 106 M35 45 L52 112" stroke="#334155" stroke-width="5" fill="none"/>
      <rect x="-64" y="94" width="24" height="24" rx="3" fill="#2563eb"/>
      <text x="-59" y="112" font-size="16" font-weight="700" fill="#fff">L</text>
      <circle cx="52" cy="112" r="11" fill="#f59e0b"/>
    </g>
    <g transform="translate(875 147)">
