<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Vier schematische Frontansichten A1, A2, B1 und B2 mit blau markierter Hand und Körpermittellinie</title>
  <desc id="desc">Gerade Sprintstrecke, erfundene Modellpositionen. Die blau markierte Hand L hat keine festgelegte anatomische Seite. A1: L links im Bild der gestrichelten Mittellinie. A2: L rechts im Bild der Mittellinie. B1 und B2: L jeweils links im Bild der Mittellinie. Es sind einzelne Zeitpunkte, keine aufgezeichnete Bewegung. Keine echte Person und keine Techniknote.</desc>
  <rect width="1000" height="420" fill="#f8fafc"/>
  <text x="32" y="37" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17324a">Armpositionen von vorn · erfundene Modellbilder</text>
  <text x="32" y="63" font-family="Arial,sans-serif" font-size="15" fill="#334155">L = markierte Hand · Seitenangaben im Bild · gestrichelt = Körpermittellinie</text>
  <defs>
    <g id="body" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="0" cy="0" r="24" fill="#e2e8f0"/>
      <path d="M-35 45 H35 M-25 45 V150 H25 V45 M-24 150 H24"/>
      <path d="M-25 150 L-34 202 M25 150 L34 202"/>
      <path d="M0 32 V213" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 7"/>
    </g>
  </defs>
  <g font-family="Arial,sans-serif">
