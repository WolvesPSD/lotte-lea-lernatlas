  <text x="273" y="128" font-family="Arial, sans-serif" font-size="20" fill="#795323">Rotes Feld</text>
  <text x="263" y="184" font-family="Arial, sans-serif" font-size="18" fill="#795323">links vorn</text>
  <text x="340" y="254" font-family="Arial, sans-serif" font-size="17" fill="#795323">rechts</text>
  <text x="340" y="274" font-family="Arial, sans-serif" font-size="17" fill="#795323">hinten</text>
