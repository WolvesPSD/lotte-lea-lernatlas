<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Zwei erfundene Spielkarten R und Z</title>
  <desc id="desc">Links Rückspiel R mit Rot rechts hinten und einer linken vorderen Fläche. Rechts Zielzonenspiel Z: Blau A mit Ball, B gedeckt von Rot 1, C frei, Rot 2 in der Mitte. Die dritte rote Person ist nicht eingezeichnet, ihre Position unbekannt. Die Zeichnung ist schematisch und beweist keinen Spielausgang.</desc>
  <rect width="960" height="440" rx="22" fill="#f7f5ef"/>
  <rect x="20" y="20" width="445" height="400" rx="18" fill="#fff" stroke="#a8bfc1" stroke-width="3"/>
  <rect x="495" y="20" width="445" height="400" rx="18" fill="#fff" stroke="#a8bfc1" stroke-width="3"/>
  <g font-family="Arial, sans-serif" fill="#123b43">
    <text x="42" y="60" font-size="27" font-weight="700">R · Rückspiel</text>
    <text x="517" y="60" font-size="27" font-weight="700">Z · Zielzone</text>
    <text x="44" y="399" font-size="19">Schematische Lage · keine Ballflug-Prognose</text>
    <text x="519" y="399" font-size="19">Rot 3 nicht gezeigt · Position unbekannt</text>
  </g>
  <rect x="84" y="95" width="337" height="265" fill="#e7f2f3" stroke="#315d66" stroke-width="3"/>
